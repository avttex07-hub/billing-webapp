<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing Web App</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #393078;
  --bg1: #40347d;
  --bg2: #51478d;
  --bg3: #5b5197;
  --border: rgba(255, 255, 255, 0.08);

  --text0: #ffffff;
  --text1: #f1eef7;
  --text2: #c4bfd2;
  --text3: #9993aa;

  --accent: #a8ed8f;
  --accent-dim: rgba(168, 237, 143, 0.16);
  --accent-text: #a8ed8f;
  --green: #55b887;
  --red: #ed514b;
  --orange: #f2a51a;

  --radius: 20px;
  --font: 'Poppins', sans-serif;
  --mono: 'DM Mono', monospace;
  --heading: 'League Spartan', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font);
  background: var(--bg0);
  color: var(--text0);
  display: flex;
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
}

#sidebar {
  width: 224px;
  min-width: 224px;
  background: var(--bg1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.sidebar-brand {
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 36px;
  height: 36px;
  background: var(--accent);
  color: #302866;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.brand-name {
  font-family: var(--heading);
  font-weight: 700;
  font-size: 16px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 18px;
  color: var(--text2);
  font-size: 14px;
  cursor: pointer;
  position: relative;
}

.nav-item:hover,
.nav-item.active {
  background: var(--accent-dim);
  color: var(--accent);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 4px;
  background: var(--accent);
  border-radius: 0 4px 4px 0;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  height: 64px;
  background: var(--bg1);
  display: flex;
  align-items: center;
  padding: 0 28px;
}

.topbar-title {
  font-family: var(--heading);
  font-weight: 700;
  font-size: 20px;
}

.page-content {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
}

h1 {
  font-family: var(--heading);
  font-size: 28px;
  margin-bottom: 22px;
}

h2 {
  font-family: var(--heading);
  font-size: 19px;
  margin: 28px 0 14px;
  color: var(--text0);
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: var(--bg2);
  border: none;
  border-radius: var(--radius);
  padding: 22px;
  min-width: 180px;
}

.card .label {
  color: var(--text2);
  font-size: 14px;
  text-transform: none;
  letter-spacing: normal;
}

.card .value {
  font-family: var(--heading);
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
  margin-top: 10px;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  background: var(--bg2);
  border-radius: var(--radius);
  overflow: hidden;
}

th,
td {
  border-bottom: 1px solid var(--border);
  padding: 15px 18px;
  text-align: left;
  font-size: 13px;
}

th {
  background: var(--bg3);
  color: var(--text2);
  font-weight: 500;
  text-transform: uppercase;
  font-size: 11px;
}

td {
  color: var(--text1);
}

.placeholder {
  color: var(--text3);
  font-size: 16px;
  padding: 60px;
  text-align: center;
}

@media (max-width: 900px) {
  .cards {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 768px) {
  body {
    display: block;
    height: auto;
    min-height: 100vh;
    overflow: auto;
  }

  #sidebar {
    width: 100%;
    min-width: 0;
    border: none;
  }

  .sidebar-brand {
    padding: 16px 20px;
  }

  #navList {
    display: flex;
    overflow-x: auto;
    padding: 0 10px 10px;
  }

  .nav-item {
    white-space: nowrap;
    padding: 10px 14px;
    border-radius: 12px;
  }

  .nav-item.active::before {
    display: none;
  }

  #main {
    min-height: calc(100vh - 105px);
  }

  .topbar {
    height: 58px;
    padding: 0 20px;
  }

  .page-content {
    padding: 20px;
  }

  h1 {
    font-size: 25px;
  }

  .cards {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .card {
    min-width: 0;
    padding: 16px;
    border-radius: 18px;
  }

  .card .value {
    font-size: 23px;
  }

  th,
  td {
    padding: 12px;
  }
}

@media (max-width: 480px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .page-content {
    padding: 16px;
  }
}
  </script>
</body>
</html>
